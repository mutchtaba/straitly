<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straitly - Every model. Same prices. 0% fees.</title>
    <meta name="description" content="The AI inference platform with zero platform fees. All models, pass-through pricing, OpenAI-compatible API.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            opacity: 0.95;
            font-weight: 600;
        }

        .description {
            font-size: 1.1rem;
            margin-bottom: 3rem;
            opacity: 0.85;
            line-height: 1.6;
        }

        .waitlist-form {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .form-title {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        input[type="email"] {
            width: 100%;
            padding: 16px 20px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: white;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        input[type="email"]::placeholder {
            color: #666;
        }

        button {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .success-message {
            display: none;
            padding: 1rem;
            background: rgba(72, 187, 120, 0.2);
            border: 2px solid rgba(72, 187, 120, 0.5);
            border-radius: 12px;
            margin-top: 1rem;
            font-weight: 500;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .description {
                font-size: 1rem;
            }

            .waitlist-form {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>straitly</h1>
        <div class="subtitle">Every model. Same prices. 0% fees.</div>
        <div class="description">
            The AI inference platform that doesn't tax you. 300+ models, pass-through pricing, OpenAI-compatible API.
        </div>

        <div class="waitlist-form">
            <div class="form-title">Join the waitlist</div>
            <form name="waitlist" method="POST" data-netlify="true" netlify-honeypot="bot-field">
                <input type="hidden" name="form-name" value="waitlist">
                <p style="display: none;">
                    <label>Don't fill this out: <input name="bot-field"></label>
                </p>
                <input 
                    type="email" 
                    name="email" 
                    placeholder="you@example.com" 
                    required
                >
                <button type="submit">Get early access</button>
            </form>
            <div class="success-message" id="successMessage">
                ✓ You're on the list! We'll email you when we launch.
            </div>
        </div>
    </div>

    <script>
        const form = document.querySelector('form');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(formData).toString()
                });

                if (response.ok) {
                    form.style.display = 'none';
                    successMessage.classList.add('show');
                }
            } catch (error) {
                alert('Something went wrong. Please try again.');
            }
        });
    </script>
</body>
</html>
